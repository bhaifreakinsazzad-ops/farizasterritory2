name: Fariza's Territory CI Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run static validation & security invariant check
        run: npm run lint

      - name: Run unit, CAPI, and HTTP integration tests
        run: npm test

      - name: Dependency vulnerability audit (high+)
        run: npm audit --audit-level=high
